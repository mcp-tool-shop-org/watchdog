name: ci

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'verify.ps1'
      - 'watchdog.ps1'
      - '.github/workflows/**'
      - 'atlas/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
      - 'codecov.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'verify.ps1'
      - 'watchdog.ps1'
      - '.github/workflows/**'
      - 'atlas/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
      - 'codecov.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Atlas check
        shell: bash
        run: npx --yes @dogfood-lab/atlas@1.26.0 check
      # Unit tests plus line coverage of src/Watchdog/Private and src/Watchdog/Public. verify.ps1 fails the step below 90%.
      - name: Pester (no GPU) with coverage
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.5.0 -Scope CurrentUser
          ./verify.ps1 -Coverage -MinCoverage 90
      # The codecov job uploads this from a job of its own, so the OIDC token never sits beside the tests.
      - name: Save coverage for Codecov
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  codecov:
    # Runs none of the repository's code: checkout (no token kept) only lets Codecov match report paths to files.
    needs: test
    if: ${{ needs.test.result == 'success' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codecov-coverage
          path: .
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage.xml
